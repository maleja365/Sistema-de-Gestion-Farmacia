<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Farmacia - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a6b3c, #2ecc71);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #1a6b3c; font-size: 28px; }
        .logo p { color: #666; font-size: 14px; }
        label { display: block; margin-bottom: 6px; color: #333; font-weight: 600; }
        input[type=text], input[type=password] {
            width: 100%; padding: 12px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #1a6b3c; }
        button {
            width: 100%; padding: 13px;
            background: #1a6b3c; color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 4px;
        }
        button:hover { background: #145c32; }
        .alert-error {
            background: #ffe0e0; color: #c00;
            padding: 10px; border-radius: 8px;
            margin-bottom: 16px; text-align: center;
        }
        .alert-logout {
            background: #e0ffe8; color: #1a6b3c;
            padding: 10px; border-radius: 8px;
            margin-bottom: 16px; text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🏥 FarmaciApp</h1>
        <p>Sistema de Farmacia con Domicilios</p>
    </div>

    <!-- Mensaje de error -->
    <div class="alert-error" th:if="${param.error}">
        ❌ Usuario o contraseña incorrectos.
    </div>

    <!-- Mensaje de cierre de sesión -->
    <div class="alert-logout" th:if="${param.logout}">
        ✅ Sesión cerrada correctamente.
    </div>

    <!-- Formulario — action apunta al POST de Spring Security -->
    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" 
               placeholder="Tu usuario" required autofocus/>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" 
               placeholder="Tu contraseña" required/>

        <!-- Token CSRF que Spring Security requiere -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <button type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
